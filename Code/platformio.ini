; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    adafruit/RTClib
    adafruit/Adafruit BME680 Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit LED Backpack Library
    adafruit/Adafruit NeoPixel

monitor_port = COM7
monitor_speed = 9600

; -------------------------------------------------------------------
; ESSAI BSEC2 (sans casser l'env principal)
; -------------------------------------------------------------------
; Le code actuel reste sur Adafruit_BME680 dans [env:uno].
; BSEC2 est souvent lourd et/ou non supporté sur ATmega328P (UNO).
; Si tu veux tenter, fais-le dans un environnement séparé pour ne pas
; impacter le projet actuel.
;
; [env:uno_bsec2_try]
; platform = atmelavr
; board = uno
; framework = arduino
; lib_deps =
;     adafruit/RTClib
;     adafruit/Adafruit GFX Library
;     adafruit/Adafruit LED Backpack Library
;     adafruit/Adafruit NeoPixel
;     boschsensortec/BSEC Software Library
; build_flags =
;     -DUSE_BSEC2
; monitor_speed = 9600
